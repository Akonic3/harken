# Render Blueprint — one-click deploy from this repo.
services:
  - type: web
    name: harken
    runtime: docker
    plan: starter            # a persistent disk needs a paid plan; free tier loses data on restart
    healthCheckPath: /health
    disk:
      name: harken-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HARKEN_DB
        value: /data/harken.db
      - key: HARKEN_THEME_MODE
        value: hospital
      - key: HARKEN_SOURCES
        value: googlereviews,rss,youtube
      - key: HARKEN_OUTSCRAPER_API_KEY
        sync: false          # paste your Outscraper key in the Render screen
      - key: HARKEN_GOOGLE_PLACES
        value: KIMS Saveera=KIMS - Saveera Hospital, 1-1348 Srinagar Colony Extension, Rudrampeta, Anantapur 515004
      - key: HARKEN_AUTH_USERNAME
        sync: false          # you type these in the Render screen
      - key: HARKEN_AUTH_PASSWORD
        sync: false
